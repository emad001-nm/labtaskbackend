# =========================================================
# PRODUCTION CONFIGURATION (Render / Railway)
# সব sensitive value env variable থেকে আসবে।
# =========================================================

# ===== Server =====
server.port=${PORT:8080}

# ===== MongoDB (Atlas) =====
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=borrowbox
spring.data.mongodb.auto-index-creation=true

# ===== CORS (Production) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===== Logging =====
logging.level.root=INFO
logging.level.com.borrowbox=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.springframework.security=WARN

